openapi: 3.0.0
info:
  title: oskbackend API
  version: 1.0.0
  description: |
    Backend API for Open Source Kigali.

    All responses follow a consistent envelope:
      Success: `{ "success": true, "message": string, "data": T }`
      Failure: `{ "success": false, "message": string, "data": null }`

    Image uploads use the multipart field `file`.
    Allowed types are JPEG (`image/jpeg` or `image/jpg`), PNG, WebP, and GIF.
    The file header must match that format. A matching Content-Type with other bytes returns 400.
    SVG is not accepted: uploads are stored and served as submitted, and SVG can contain scripts.
    The maximum size is 5 MB (5242880 bytes).
    An unsupported or mismatched file returns 400. A larger file returns 413.
    Both use the failure envelope and do not include internal error details.

    ## Admin session authentication (Phase 2)

    Cookie-backed administrator login is available under `/auth`.
    All admin mutations and admin-only reads require an authenticated ADMIN session
    cookie (`osk_session`). The shared `x-api-key` header is no longer accepted
    for those routes. Session cookies are HttpOnly; the session token is never
    returned in JSON. Cross-origin browsers must send credentials.
    CSRF: after login, send the `csrfToken` from the login (or `GET /auth/csrf`)
    response in the `X-CSRF-Token` header on every state-changing cookie-authenticated
    request (admin CRUD/refresh and `POST /auth/logout`). Admin GET endpoints that
    expose non-public data require the session cookie but not a CSRF token.
    Login, logout, and admin writes also require a trusted `Origin` (or Referer
    origin) that matches `CORS_ORIGINS`.

    ## Review moderation

    Public `GET /reviews` and `GET /reviews/{id}` return approved testimonials only.
    Pending and rejected reviews are omitted from those responses, and a non-approved
    detail lookup returns 404. `POST /reviews` always creates a `PENDING` review.
    Clients cannot set `status`, `reviewedAt`, or `reviewedById`.
    Admins list the queue at `GET /admin/reviews` (defaults to `PENDING`), read any
    review at `GET /admin/reviews/{id}`, and approve or reject with
    `PATCH /admin/reviews/{id}/status`. Content edits through `PUT /reviews/{id}`
    do not change moderation status. The migration backfills existing reviews to
    `APPROVED`, then sets the default for new rows to `PENDING`.
servers:
  - url: /api

tags:
  - name: Health
  - name: Auth
  - name: Members
  - name: Events
  - name: Partners
  - name: Partner Applications
  - name: Projects
  - name: Contributors
  - name: Reviews
  - name: Users
  - name: Stats

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          uptime: { type: number }
                          db: { type: string, example: ok }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                  db:
                    type: string
                    example: unreachable

  /auth/login:
    post:
      tags: [Auth]
      summary: Administrator login
      description: |
        Validates administrator credentials, creates a server-side session, and
        sets the HttpOnly `osk_session` cookie. The session token is never
        returned in the JSON body. Requires a trusted Origin. Failed attempts
        are rate limited.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
          description: Must match an entry in CORS_ORIGINS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Set-Cookie:
              description: HttpOnly session cookie named `osk_session`
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSessionPayload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current administrator session
      description: Returns the authenticated admin identity from the session cookie.
      parameters:
        - in: cookie
          name: osk_session
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthMePayload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/csrf:
    get:
      tags: [Auth]
      summary: Issue a session-bound CSRF token
      description: |
        Returns a CSRF token bound to the current admin session. Send it as the
        `X-CSRF-Token` header on cookie-authenticated state-changing requests.
        This token is not the session cookie value.
      parameters:
        - in: cookie
          name: osk_session
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CSRF token issued successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [csrfToken]
                        properties:
                          csrfToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Administrator logout
      description: |
        Revokes the current server-side session and clears the session cookie.
        Requires a trusted Origin and a valid `X-CSRF-Token` header.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: cookie
          name: osk_session
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { type: object, nullable: true, example: null }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /members:
    get:
      tags: [Members]
      summary: List all members
      responses:
        "200":
          description: Members retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Members]
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Member created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /members/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Members]
      summary: Get a member by id
      responses:
        "200":
          description: Member retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Members]
      summary: Update a member (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdateInput" }
      responses:
        "200":
          description: Member updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Members]
      summary: Delete a member (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Member deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /events:
    get:
      tags: [Events]
      summary: List all events
      responses:
        "200":
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Events]
      summary: Create an event (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Event created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /events/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      summary: Get an event by id
      responses:
        "200":
          description: Event retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Events]
      summary: Update an event (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/EventUpdateInput" }
      responses:
        "200":
          description: Event updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Events]
      summary: Delete an event (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Event deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /partners:
    get:
      tags: [Partners]
      summary: List all patners
      responses:
        "200":
          description: Partners retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Partner" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Partners]
      summary: Create a partner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "201":
          description: Partner created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Partner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /partners/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Partners]
      summary: Get a partner by id
      responses:
        "200":
          description: Partner retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Partner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Partners]
      summary: Update a partner (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PartnerUpdateInput" }
      responses:
        "200":
          description: Partner updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Partner" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Partners]
      summary: Delete a partner (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Partner deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /partner-applications:
    post:
      tags: [Partner Applications]
      summary: Submit a partner application (with logo upload)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PartnerApplicationInput" }
      responses:
        "201":
          description: Partner application submitted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PartnerApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Partner Applications]
      summary: List all partner applications (admin only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Partner applications retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          { $ref: "#/components/schemas/PartnerApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /partner-applications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Partner Applications]
      summary: Get a partner application by id (admin only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Partner application retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PartnerApplication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Partner Applications]
      summary: Delete a partner application (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Partner application deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /partner-applications/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Partner Applications]
      summary: Update a partner application status (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/PartnerApplicationStatusInput" }
      responses:
        "200":
          description: Partner application status updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PartnerApplication" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects:
    get:
      tags: [Projects]
      summary: List all projects
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: education
          description: Filter projects by category. When provided, only projects in the selected category are returned.
      responses:
        "200":
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
              examples:
                allProjects:
                  summary: All projects
                  value:
                    success: true
                    message: Projects retrieved successfully
                    data:
                      - slug: osk-backend
                        category: backend
                filteredByCategory:
                  summary: Projects filtered by category
                  value:
                    success: true
                    message: Projects retrieved successfully
                    data:
                      - slug: osk-backend
                        category: education
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Projects]
      summary: Create a project (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Project created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/refresh:
    post:
      tags: [Projects]
      summary: Refresh GitHub-cached filds for all projects (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Refresh completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProjectRefreshResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/slug/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      summary: Get a project by slug
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Projects]
      summary: Get a project by id
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Projects]
      summary: Update a project (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProjectUpdateInput" }
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Projects]
      summary: Delete a project (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Project deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contributors:
    get:
      tags: [Contributors]
      summary: Read and return contributors.json
      responses:
        "200":
          description: Contributors retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            login: { type: string }
                            name: { type: string }
                            avatarUrl: { type: string }
                            profileUrl: { type: string }
                            bio: { type: string }
                            company: { type: string }
        "500": { $ref: "#/components/responses/InternalError" }

  /contributors/refresh:
    post:
      tags: [Contributors]
      summary: Parse CONTRIBUTORS.md, fetch all GitHub profiles, overwrite contributors.json
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Contributors refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalParsed: { type: number }
                          success: { type: number }
                          failures: { type: number }
                          failedList:
                            type: array
                            items:
                              type: object
                              properties:
                                login: { type: string }
                                error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /reviews:
    get:
      tags: [Reviews]
      summary: List approved reviews
      description: Returns approved testimonials only. Pending and rejected reviews are omitted, and moderation fields are not included.
      responses:
        "200":
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Review" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Reviews]
      summary: Submit a review for moderation
      description: |
        Public multipart submission. The review is stored as `PENDING` and is not
        returned by public reads until an admin approves it. A client-supplied
        `status`, `reviewedAt`, or `reviewedById` is rejected with 400.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Review submitted for moderation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ReviewSubmission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }

  /reviews/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reviews]
      summary: Get an approved review by id
      description: Returns 404 when the review is missing, pending, or rejected.
      responses:
        "200":
          description: Review retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Review" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Reviews]
      summary: Update review content (admin only)
      description: |
        Edits name, role, message, or the profile image. Does not change moderation
        status. Sending `status`, `reviewedAt`, or `reviewedById` returns 400 and
        leaves the review unchanged.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ReviewUpdateInput" }
      responses:
        "200":
          description: Review updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Reviews]
      summary: Delete a review (admin only)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Review deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for moderation (admin only)
      description: |
        Defaults to `PENDING` when `status` is omitted. Requires an admin session.
        Does not require a CSRF token.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
          description: Moderation status to list. Defaults to PENDING.
      responses:
        "200":
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/reviews/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Reviews]
      summary: Get any review for moderation (admin only)
      description: Returns pending, approved, and rejected reviews. Requires an admin session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Review retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminReview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/reviews/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Reviews]
      summary: Approve or reject a review (admin only)
      description: |
        Accepts only `APPROVED` or `REJECTED`. Allowed transitions are
        `PENDING` to `APPROVED` or `REJECTED`, `APPROVED` to `REJECTED`, and
        `REJECTED` to `APPROVED`. Repeating the current status returns 409.
        Requires a trusted Origin, an admin session, and `X-CSRF-Token`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewModerationInput" }
      responses:
        "200":
          description: Review moderation status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /stats:
    get:
      tags: [Stats]
      summary: Fetch community stats
      responses:
        "200":
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contributors: { type: number }
                          members: { type: number }
                          projects: { type: number }
                          events: { type: number }
                          partners: { type: number }
                          reviews:
                            type: number
                            description: Count of approved reviews only.
                          pullRequests: { type: number }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: osk_session
      description: HttpOnly admin session cookie issued by POST /auth/login.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound CSRF token from login or GET /auth/csrf. Required on state-changing admin requests.

  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthUserPublic:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN] }

    AuthSessionPayload:
      type: object
      required: [user, expiresAt, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/AuthUserPublic" }
        expiresAt: { type: string, format: date-time }
        csrfToken:
          type: string
          description: Session-bound CSRF token for X-CSRF-Token header; not the session cookie.

    AuthMePayload:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/AuthUserPublic" }
        expiresAt: { type: string, format: date-time }

    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}
      required: [success, message, data]

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        data: { type: object, nullable: true, example: null }
      required: [success, message, data]

    ImageUpload:
      type: string
      format: binary
      description: >
        Multipart field `file`. Allowed types: JPEG (`image/jpeg` or `image/jpg`),
        PNG, WebP, and GIF. The file header must match one of those formats.
        SVG is not accepted. Maximum size is 5 MB (5242880 bytes).
        Unsupported or mismatched files return 400. Files over the limit return 413.

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        profileUrl: { type: string }
        profilePublicId: { type: string }
        role: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [name, role, message, file]
      properties:
        name: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 2000 }
        file: { $ref: "#/components/schemas/ImageUpload" }

    ReviewSubmission:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [PENDING]
              description: New public submissions are always pending.

    ReviewUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 2000 }
        file: { $ref: "#/components/schemas/ImageUpload" }

    ReviewModerator:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    AdminReview:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED]
            reviewedAt:
              type: string
              format: date-time
              nullable: true
            reviewedBy:
              allOf:
                - $ref: "#/components/schemas/ReviewModerator"
              nullable: true

    ReviewModerationInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        githubUsername: { type: string }
        orgName: { type: string }
        joinReason: { type: string }
        codingLevel:
          type: string
          enum: [beginner, intermediate, advanced]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MemberInput:
      type: object
      required: [name, email, githubUsername, orgName, joinReason, codingLevel]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        githubUsername: { type: string }
        orgName: { type: string }
        joinReason: { type: string }
        codingLevel:
          type: string
          enum: [beginner, intermediate, advanced]

    MemberUpdateInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        githubUsername: { type: string }
        orgName: { type: string }
        joinReason: { type: string }
        codingLevel:
          type: string
          enum: [beginner, intermediate, advanced]

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        tagline: { type: string, nullable: true }
        imageUrl: { type: string }
        imagePublicId: { type: string }
        description: { type: string }
        category: { type: string }
        mode: { type: string, example: "in-person" }
        featured: { type: boolean }
        capacity: { type: integer, nullable: true }
        registered: { type: integer, nullable: true }
        date: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        timeLabel: { type: string, nullable: true }
        location: { type: string }
        speakers:
          type: array
          items: { type: string }
        registerUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventInput:
      type: object
      required: [title, file, description, category, date, location]
      properties:
        title: { type: string }
        tagline: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        description: { type: string }
        category: { type: string }
        mode: { type: string, example: "in-person" }
        featured: { type: boolean }
        capacity: { type: integer }
        registered: { type: integer }
        date: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        timeLabel: { type: string }
        location: { type: string }
        speakers:
          type: string
          description: "JSON array string or comma-separated names"
          example: '["Didas Mbarushimana", "Guest Mentor"]'
        registerUrl: { type: string }

    EventUpdateInput:
      type: object
      properties:
        title: { type: string }
        tagline: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        description: { type: string }
        category: { type: string }
        mode: { type: string }
        featured: { type: boolean }
        capacity: { type: integer }
        registered: { type: integer }
        date: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        timeLabel: { type: string }
        location: { type: string }
        speakers:
          { type: string, description: "JSON array string or comma-separated" }
        registerUrl: { type: string }

    Partner:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        websiteUrl: { type: string }
        logoUrl: { type: string }
        logoPublicId: { type: string }
        description: { type: string }
        email: { type: string, format: email }
        partnershipReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PartnerInput:
      type: object
      required: [name, websiteUrl, file, description, email, partnershipReason]
      properties:
        name: { type: string }
        websiteUrl: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        description: { type: string }
        email: { type: string, format: email }
        partnershipReason: { type: string }

    PartnerUpdateInput:
      type: object
      properties:
        name: { type: string }
        websiteUrl: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        description: { type: string }
        email: { type: string, format: email }
        partnershipReason: { type: string }

    PartnerApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        organisationName: { type: string }
        organisationLogoUrl: { type: string }
        organisationType:
          type: string
          enum:
            [
              University / School,
              Tech Company,
              Government Body,
              NGO / Community Hub,
              Other,
            ]
        website: { type: string }
        organisationSize:
          type: string
          enum:
            [
              "1–10 people",
              "11–50 people",
              "51–200 people",
              "201–500 people",
              "500+ people",
            ]
        country: { type: string }
        description: { type: string, maxLength: 300 }
        partnershipTier:
          type: string
          enum: [Gold Partner, Silver Partner, Community Partner, Not Sure Yet]
        organisationOffer: { type: string, maxLength: 600 }
        projectIdea: { type: string, nullable: true }
        fullName: { type: string }
        jobTitle: { type: string }
        workEmail: { type: string, format: email }
        agreedToTerms: { type: boolean }
        status:
          type: string
          enum: [Pending, Contacted, Approved, Rejected]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PartnerApplicationInput:
      type: object
      required:
        [
          organisationName,
          file,
          organisationType,
          website,
          organisationSize,
          country,
          description,
          partnershipTier,
          organisationOffer,
          fullName,
          jobTitle,
          workEmail,
          agreedToTerms,
        ]
      properties:
        organisationName: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        organisationType:
          type: string
          enum:
            [
              University / School,
              Tech Company,
              Government Body,
              NGO / Community Hub,
              Other,
            ]
        website: { type: string }
        organisationSize:
          type: string
          enum:
            [
              "1–10 people",
              "11–50 people",
              "51–200 people",
              "201–500 people",
              "500+ people",
            ]
        country: { type: string }
        description: { type: string, maxLength: 300 }
        partnershipTier:
          type: string
          enum: [Gold Partner, Silver Partner, Community Partner, Not Sure Yet]
        organisationOffer: { type: string, maxLength: 600 }
        projectIdea: { type: string }
        fullName: { type: string }
        jobTitle: { type: string }
        workEmail: { type: string, format: email }
        agreedToTerms: { type: boolean }

    PartnerApplicationStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Pending, Contacted, Approved, Rejected]

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        repoOwner: { type: string }
        repoName: { type: string }
        imageUrl: { type: string }
        imagePublicId: { type: string }
        tagline: { type: string }
        category: { type: string }
        status: { type: string, enum: [active, archived, paused] }
        featured: { type: boolean }
        maintainer: { type: string, nullable: true }
        langColor: { type: string, nullable: true }
        ghDescription: { type: string, nullable: true }
        ghLanguage: { type: string, nullable: true }
        ghTopics:
          type: array
          items: { type: string }
        ghStars: { type: integer }
        ghForks: { type: integer }
        ghOpenIssues: { type: integer }
        ghContributors: { type: integer }
        ghPullRequests: { type: integer }
        ghPushedAt: { type: string, format: date-time, nullable: true }
        lastFetchedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [slug, repoOwner, repoName, file, tagline, category]
      properties:
        slug: { type: string }
        repoOwner: { type: string }
        repoName: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        tagline: { type: string }
        category: { type: string }
        status: { type: string, enum: [active, archived, paused] }
        featured: { type: boolean }
        maintainer: { type: string }
        langColor: { type: string }

    ProjectUpdateInput:
      type: object
      properties:
        slug: { type: string }
        repoOwner: { type: string }
        repoName: { type: string }
        file: { $ref: "#/components/schemas/ImageUpload" }
        tagline: { type: string }
        category: { type: string }
        status: { type: string, enum: [active, archived, paused] }
        featured: { type: boolean }
        maintainer: { type: string }
        langColor: { type: string }

    ProjectRefreshResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        ok: { type: boolean }
        error: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, USER] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Origin or CSRF check failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: The requested moderation transition is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
